[project]
name = "hype-ai-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "python-multipart>=0.0.9,<1",
  "pydantic-settings>=2.6,<3",
  "openai>=2.26,<3",
  "runwayml>=5.20,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
markers = ["integration: requires real PostgreSQL and Redis services"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = ["arg-type", "index"]
