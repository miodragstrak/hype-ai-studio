services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hype_test
      POSTGRES_PASSWORD: hype_test
      POSTGRES_DB: postgres
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hype_test -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 20
  redis-test:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 20
